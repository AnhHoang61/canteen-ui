<!-- @dsCard height=288 -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Canteen POS</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--brand); }
  .blue { fill:var(--info); }
  .accent { fill:var(--accent); }
  .deep { fill:var(--ink); }
  .cut { fill:var(--brand-soft); }
  .tile { fill:var(--surface-raised); }
  .blk { rx:var(--radius-lg); }
  .t { rx:var(--radius-md); }
  .qty { fill:var(--accent); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:100px; line-height:.95; font-weight:700; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      info 168×280 slab bled off the top (the icon blue people see on every row) · accent 120×168 (amber notes, bonus money) · brand 120×96 (the black primary button) · ink 176×280 bleeding off top and right — ≈45% of the cover
  arrangement one tall blue slab, a stacked amber/black column, an ink slab off the right edge; space-4 gutters, bottoms on y=264
  pattern     tiles, from "white cards on grey, rows with chevrons": 56×40 list tiles in surface-raised cut into the ink slab, two merged two-wide, one accent qty disc; brand-soft rows cut into the blue slab
  scales      gutters space-4 (16); tile gap space-3 (12); corners radius-lg (12) on blocks, radius-md (10) on tiles; qty disc r = half of space-5
-->
<rect class="blue blk" x="0" y="-16" width="168" height="280" rx="12"/>
<rect class="cut t" x="16" y="216" width="136" height="32" rx="10"/>
<rect class="cut t" x="16" y="164" width="62" height="40" rx="10"/>
<rect class="cut t" x="90" y="164" width="62" height="40" rx="10"/>
<rect class="accent blk" x="184" y="-16" width="120" height="168" rx="12"/>
<rect class="brand blk" x="184" y="168" width="120" height="96" rx="12"/>
<rect class="deep blk" x="320" y="-16" width="176" height="280" rx="12"/>
<rect class="tile t" x="336" y="16" width="56" height="40" rx="10"/>
<rect class="tile t" x="404" y="16" width="56" height="40" rx="10"/>
<rect class="tile t" x="336" y="68" width="124" height="40" rx="10"/>
<rect class="tile t" x="336" y="120" width="56" height="40" rx="10"/>
<rect class="tile t" x="404" y="120" width="56" height="40" rx="10"/>
<rect class="tile t" x="336" y="172" width="56" height="40" rx="10"/>
<rect class="tile t" x="404" y="172" width="56" height="40" rx="10"/>
<circle class="qty" cx="456" cy="124" r="12"/>
<rect class="tile t" x="336" y="224" width="124" height="28" rx="10"/>
</svg>
</div>
<div class="words">
<h1 class="name">Canteen<br>POS</h1>
<p class="tag">POS bán hàng tại quầy cho Canteen trường học.</p>
</div>
</div>
</body>
</html>
