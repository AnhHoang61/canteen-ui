<title>Canteen Kiosk tự phục vụ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root,:root[data-theme="dark"]{--surface:#f4f5f7;--surface-raised:#ffffff;--surface-sunken:#f4f5f7;--line:#eceef1;--line-strong:#8e939b;--ink:#1d1f24;--ink-muted:#60656d;--brand:#1d1f24;--on-brand:#ffffff;--brand-soft:#e9f1fd;--accent:#f5a623;--on-accent:#1d1f24;--accent-soft:#fdf3e1;--accent-ink:#946200;--success:#0f7a5c;--success-soft:#e3f5ee;--warning:#9a4f00;--warning-soft:#fdeedb;--danger:#c0281b;--danger-soft:#fde8e6;--info:#1a62c2;--info-soft:#e9f1fd;--focus:#1a62c2;--qr-ink:#111111;--qr-ground:#ffffff;--shadow-1:none;--shadow-2:0 8px 24px rgba(29,31,36,0.12);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--tap-min:48px;--tap-lg:56px;--cart-width:400px;--radius-sm:6px;--radius-md:10px;--radius-lg:12px;--radius-pill:999px;--font-sans:Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;color-scheme:light}
body{background:var(--surface);color:var(--ink)}

/* ---------- base ---------- */
.cp, .cp * { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 22px; -webkit-font-smoothing: antialiased; }
.cp-num { font-variant-numeric: tabular-nums; }
.cp-muted { color: var(--ink-muted); }
.cp-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.cp-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.cp-pad { padding: var(--space-4); }
.cp-ico { flex: none; }
:where(.cp) :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- Button ---------- */
.cp-btn { font: 700 16px/22px var(--font-sans); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--tap-min); padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.cp-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cp-btn-lg { min-height: var(--tap-lg); font-size: 18px; padding: 0 var(--space-5); }
.cp-btn-sm { min-height: 36px; font-size: 13px; padding: 0 var(--space-3); }
.cp-btn-block { display: flex; width: 100%; }
.cp-btn-primary { background: var(--brand); color: var(--on-brand); }
.cp-btn-secondary { background: var(--surface-raised); color: var(--ink); border-color: var(--line); }
.cp-btn-secondary .cp-ico, .cp-btn-ghost .cp-ico { color: var(--info); }
.cp-btn-ghost { background: transparent; color: var(--ink); }
.cp-btn-ghost:hover { background: var(--surface-sunken); }
.cp-btn-accent { background: var(--accent); color: var(--on-accent); }
.cp-btn-danger { background: var(--danger-soft); color: var(--danger); }
.cp-btn:disabled { background: var(--line); color: var(--ink-muted); border-color: transparent; cursor: not-allowed; }

/* ---------- StatusBadge ---------- */
.cp-badge { display: inline-flex; align-items: center; gap: var(--space-1); font: 500 13px/18px var(--font-sans); padding: 3px 8px; border-radius: var(--radius-sm); white-space: nowrap; }
.cp-badge .cp-dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: currentColor; }
.cp-badge-neutral { background: var(--surface-sunken); color: var(--ink-muted); }
.cp-badge-brand { background: var(--brand-soft); color: var(--brand); }
.cp-badge-accent { background: var(--accent-soft); color: var(--accent-ink); }
.cp-badge-success { background: var(--success-soft); color: var(--success); }
.cp-badge-warning { background: var(--warning-soft); color: var(--warning); }
.cp-badge-danger { background: var(--danger-soft); color: var(--danger); }
.cp-badge-info { background: var(--info-soft); color: var(--info); }

/* ---------- Money ---------- */
.cp-money { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.cp-money-lg { font-size: 26px; line-height: 32px; font-weight: 700; }
.cp-money-xl { font-size: 40px; line-height: 44px; font-weight: 700; letter-spacing: -0.02em; }
.cp-money-strike { text-decoration: line-through; color: var(--ink-muted); }
.cp-money-accent { color: var(--accent-ink); }
.cp-money-brand { color: var(--brand); }
.cp-money-danger { color: var(--danger); }
.cp-money-success { color: var(--success); }

/* ---------- TopBar ---------- */
.cp-top { display: flex; align-items: center; gap: var(--space-3); height: 60px; padding: 0 var(--space-4); background: var(--surface); }
.cp-top-name { font: 700 19px/24px var(--font-sans); letter-spacing: -0.01em; margin-right: var(--space-2); white-space: nowrap; }
.cp-top-name b { color: var(--info); }
.cp-chip { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/18px var(--font-sans); padding: 6px 10px; border-radius: var(--radius-sm); background: var(--surface-raised); color: var(--ink); white-space: nowrap; }
.cp-chip .cp-ico { color: var(--info); }
.cp-chip span { color: var(--ink-muted); font-weight: 500; }
.cp-top-spacer { flex: 1; }
.cp-top-user { display: flex; align-items: center; gap: var(--space-2); font: 600 14px/20px var(--font-sans); white-space: nowrap; }
.cp-avatar { width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--info-soft); color: var(--info); display: grid; place-items: center; font: 700 13px/1 var(--font-sans); }

/* ---------- CategoryTabs ---------- */
.cp-tabs { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: 2px; }
.cp-tab { font: 500 15px/20px var(--font-sans); min-height: var(--tap-min); padding: 0 var(--space-4); border-radius: var(--radius-pill); border: 1px solid transparent; background: var(--surface-raised); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
.cp-tab small { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.cp-tab[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.cp-tab[aria-selected="true"] small { color: var(--on-brand); opacity: .85; }

/* ---------- MenuItemCard ---------- */
.cp-menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--space-3); }
.cp-item { position: relative; text-align: left; display: flex; flex-direction: column; gap: var(--space-2); min-height: 124px; padding: var(--space-3); border-radius: var(--radius-lg); border: 0; background: var(--surface-raised); color: var(--ink); box-shadow: var(--shadow-1); cursor: pointer; font: inherit; }
.cp-item:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cp-item-code { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.cp-item-name { font: 700 16px/22px var(--font-sans); flex: 1; }
.cp-item-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.cp-item-stock { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.cp-item-qty { position: absolute; top: -8px; right: -8px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: var(--radius-pill); background: var(--accent); color: var(--on-accent); font: 700 14px/28px var(--font-sans); text-align: center; box-shadow: var(--shadow-1); }
.cp-item.is-selected { background: var(--brand-soft); box-shadow: inset 0 0 0 2px var(--brand); }
.cp-item.is-soldout, .cp-item.is-blocked { cursor: not-allowed; box-shadow: none; background: var(--line); }
.cp-item.is-soldout .cp-item-name, .cp-item.is-soldout .cp-money { color: var(--ink-muted); }
.cp-item.is-blocked { background: var(--surface-raised); box-shadow: inset 0 0 0 1.5px var(--danger); }

/* ---------- OrderCart ---------- */
.cp-cart { display: flex; flex-direction: column; background: var(--surface-raised); border: 0; border-radius: var(--radius-lg); overflow: hidden; min-height: 0; }
.cp-cart-head { padding: var(--space-4); border-bottom: 1px solid var(--line); }
.cp-cart-title { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); font: 700 18px/24px var(--font-sans); }
.cp-cart-meta { margin-top: var(--space-1); font: 500 12px/16px var(--font-sans); color: var(--ink-muted); display: flex; gap: var(--space-3); flex-wrap: wrap; }
.cp-cart-lines { flex: 1; overflow: auto; padding: 0 var(--space-4); }
.cp-line { display: grid; grid-template-columns: 1fr auto 76px; gap: var(--space-3); align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cp-line:last-child { border-bottom: 0; }
.cp-line-name { font: 500 16px/22px var(--font-sans); }
.cp-line-unit { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.cp-line-total { text-align: right; align-self: center; }
.cp-stepper { display: inline-flex; align-items: center; background: var(--surface-sunken); border-radius: var(--radius-md); overflow: hidden; }
.cp-stepper button { width: 40px; height: 40px; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.cp-stepper button:hover { background: var(--line); }
.cp-stepper output { min-width: 32px; text-align: center; font: 600 15px/40px var(--font-sans); }
.cp-cart-sum { padding: var(--space-3) var(--space-4); background: var(--surface-raised); border-top: 1px solid var(--line); display: grid; gap: 6px; }
.cp-sum-row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); font-size: 14px; }
.cp-sum-row.is-discount { color: var(--accent-ink); }
.cp-sum-row.is-total { font: 700 16px/22px var(--font-sans); padding-top: 6px; border-top: 1px solid var(--line); }
.cp-cart-foot { padding: var(--space-3) var(--space-4) var(--space-4); display: grid; gap: var(--space-2); }
.cp-cart-empty { padding: var(--space-6) var(--space-4); text-align: center; color: var(--ink-muted); }

/* ---------- BuyerCard ---------- */
.cp-buyer { background: var(--surface-raised); border: 0; border-radius: var(--radius-lg); padding: var(--space-4); display: grid; gap: var(--space-3); }
.cp-buyer-head { display: flex; gap: var(--space-3); align-items: center; }
.cp-buyer-photo { width: 52px; height: 52px; border-radius: var(--radius-pill); background: var(--info-soft); color: var(--info); display: grid; place-items: center; font: 700 18px/1 var(--font-sans); flex: none; }
.cp-buyer-name { font: 700 18px/24px var(--font-sans); }
.cp-buyer-sub { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.cp-wallet { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.cp-wallet-cell { border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); background: var(--brand-soft); }
.cp-wallet-cell.is-bonus { background: var(--accent-soft); }
.cp-wallet.is-3 { grid-template-columns: 1fr 1fr 1fr; }
.cp-wallet-cell.is-limit { background: var(--surface-sunken); }
.cp-wallet-cell label { display: block; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.cp-meter { height: 8px; border-radius: var(--radius-pill); background: var(--surface-sunken); overflow: hidden; }
.cp-meter i { display: block; height: 100%; background: var(--brand); border-radius: var(--radius-pill); }
.cp-meter.is-high i { background: var(--warning); }
.cp-meter.is-over i { background: var(--danger); }
.cp-limit-row { display: flex; justify-content: space-between; font: 500 13px/18px var(--font-sans); color: var(--ink-muted); margin-bottom: 6px; }
.cp-blocked { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; font: 500 13px/18px var(--font-sans); }

/* ---------- IdentifyPanel ---------- */
.cp-identify { display: grid; gap: var(--space-3); }
.cp-id-methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.cp-id-method { min-height: 88px; border-radius: var(--radius-lg); border: 0; background: var(--surface-raised); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 14px/20px var(--font-sans); cursor: pointer; }
.cp-id-method .cp-ico { color: var(--info); }
.cp-id-method[aria-pressed="true"] { background: var(--brand-soft); box-shadow: inset 0 0 0 2px var(--brand); }
.cp-id-status { border-radius: var(--radius-md); padding: var(--space-3); display: flex; gap: var(--space-2); align-items: center; font: 500 14px/20px var(--font-sans); background: var(--surface-sunken); color: var(--ink-muted); }
.cp-id-status.is-reading { background: var(--info-soft); color: var(--info); }
.cp-id-status.is-found { background: var(--success-soft); color: var(--success); }
.cp-id-status.is-error { background: var(--danger-soft); color: var(--danger); }

/* ---------- Field ---------- */
.cp-field { display: grid; gap: 6px; min-width: 0; }
.cp-field > label { font: 400 15px/20px var(--font-sans); color: var(--ink); }
.cp-field-box { display: flex; align-items: center; min-height: 56px; border: 1px solid transparent; border-radius: var(--radius-lg); background: var(--surface-raised); padding: 0 var(--space-4); gap: var(--space-2); }
:where(.cp-panel, .cp-dialog, .cp-card, .cp-cash) .cp-field-box { background: var(--surface-sunken); }
.cp-field-box .cp-ico { color: var(--info); }
.cp-field-box:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.cp-field-box input, .cp-field-box select, .cp-field-box textarea { flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font: 700 17px/24px var(--font-sans); padding: 0; }
.cp-field-box input::placeholder, .cp-field-box textarea::placeholder { color: var(--ink-muted); font-weight: 500; }
.cp-field-box textarea { padding: var(--space-2) 0; resize: none; }
.cp-field-box select { font-size: 16px; font-weight: 500; cursor: pointer; }
.cp-field-box.is-num input { font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.cp-field-suffix { color: var(--ink-muted); font: 500 14px/20px var(--font-sans); }
.cp-field-hint { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.cp-field.is-error .cp-field-box { border-color: var(--danger); }
.cp-field.is-error .cp-field-hint { color: var(--danger); }

/* ---------- CashPayment ---------- */
.cp-cash { display: grid; gap: var(--space-4); }
.cp-cash-main { display: grid; gap: var(--space-4); align-content: start; }
.cp-cash.is-wide { grid-template-columns: 1fr 1fr; gap: var(--space-5); align-items: start; }
.cp-cash.is-wide .cp-keypad button { min-height: 72px; }
.cp-due { display: flex; justify-content: space-between; align-items: baseline; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface-sunken); }
.cp-quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
.cp-quick button { min-height: var(--tap-min); border-radius: var(--radius-md); border: 0; background: var(--surface-sunken); color: var(--ink); font: 600 15px/22px var(--font-sans); cursor: pointer; }
.cp-quick button.is-exact { background: var(--info-soft); color: var(--info); }
.cp-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.cp-keypad button { min-height: 56px; border-radius: var(--radius-md); border: 0; background: var(--surface-sunken); color: var(--ink); font: 600 22px/1 var(--font-sans); cursor: pointer; }
.cp-keypad button:active { background: var(--line); }
.cp-change { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--success-soft); color: var(--success); }
.cp-change.is-short { background: var(--danger-soft); color: var(--danger); }
.cp-change label { font: 600 15px/22px var(--font-sans); display: flex; gap: var(--space-2); align-items: center; }

/* ---------- QRPayment ---------- */
.cp-qr { display: grid; grid-template-columns: auto 1fr; gap: var(--space-5); align-items: start; }
.cp-qr-code { padding: var(--space-3); background: var(--qr-ground); border-radius: var(--radius-md); border: 1px solid var(--line); line-height: 0; }
.cp-qr-code rect { fill: var(--qr-ink); }
.cp-qr-info { display: grid; gap: var(--space-3); }
.cp-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--space-4); font-size: 14px; }
.cp-kv dt { color: var(--ink-muted); }
.cp-kv dd { margin: 0; font-weight: 600; text-align: right; }
.cp-qr-state { border-radius: var(--radius-md); padding: var(--space-3); display: flex; gap: var(--space-3); align-items: flex-start; }
.cp-qr-state strong { display: block; font: 600 15px/22px var(--font-sans); }
.cp-qr-state p { margin: 2px 0 0; font: 500 13px/18px var(--font-sans); }
.cp-qr-state.is-pending, .cp-qr-state.is-offline { background: var(--warning-soft); color: var(--warning); }
.cp-qr-state.is-success { background: var(--success-soft); color: var(--success); }
.cp-qr-state.is-check { background: var(--danger-soft); color: var(--danger); }
.cp-note { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); display: flex; gap: 6px; align-items: flex-start; }

/* ---------- PreorderTicket ---------- */
.cp-ticket { background: var(--surface-raised); border: 0; border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-2); box-shadow: var(--shadow-1); }
.cp-ticket-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
.cp-ticket-code { font: 600 16px/22px var(--font-sans); }
.cp-ticket-who { font: 700 16px/22px var(--font-sans); }
.cp-ticket-items { margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 20px; color: var(--ink); }
.cp-ticket-items li { display: flex; gap: var(--space-2); }
.cp-ticket-items b { font-family: var(--font-sans); min-width: 28px; }
.cp-ticket-time { display: flex; gap: var(--space-3); flex-wrap: wrap; font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.cp-ticket-time strong { color: var(--ink); font-family: var(--font-sans); }
.cp-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.cp-steps i { height: 4px; border-radius: var(--radius-pill); background: var(--surface-sunken); }
.cp-steps i.on { background: var(--brand); }

/* ---------- ShiftSummary ---------- */
.cp-shift { display: grid; gap: var(--space-4); }
.cp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
.cp-kpi { background: var(--surface-raised); border: 0; border-radius: var(--radius-md); padding: var(--space-3); }
.cp-kpi label { display: block; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin-bottom: 4px; }
.cp-kpi .cp-money, .cp-kpi .cp-num { font-size: 20px; line-height: 26px; font-weight: 600; }
.cp-table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface-raised); border-radius: var(--radius-md); overflow: hidden; }
.cp-table th, .cp-table td { padding: 10px var(--space-3); border-bottom: 1px solid var(--line); text-align: left; }
.cp-table th { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); background: var(--surface-raised); }
.cp-table td.r, .cp-table th.r { text-align: right; }
.cp-table tr.is-total td { font-weight: 600; border-bottom: 0; }
.cp-variance { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.cp-variance.is-ok { background: var(--success-soft); color: var(--success); }
.cp-variance.is-over { background: var(--warning-soft); color: var(--warning); }
.cp-variance.is-short { background: var(--danger-soft); color: var(--danger); }

/* ---------- OfflineBanner ---------- */
.cp-offline { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); margin: 0 var(--space-4); border-radius: var(--radius-lg); background: var(--warning-soft); color: var(--warning); font: 500 14px/20px var(--font-sans); }
.cp-offline strong { font-weight: 700; }
.cp-offline .cp-top-spacer { flex: 1; }
.cp-offline.is-syncing { background: var(--info-soft); color: var(--info); }

/* ---------- Screens (layout helpers) ---------- */
.cp-app { display: flex; flex-direction: column; height: 100vh; min-height: 720px; background: var(--surface); }
.cp-pos { flex: 1; display: grid; grid-template-columns: 1fr var(--cart-width); gap: var(--space-4); padding: var(--space-4); min-height: 0; }
.cp-pos-main { display: flex; flex-direction: column; gap: var(--space-3); min-height: 0; overflow: hidden; }
.cp-pos-side { display: flex; flex-direction: column; gap: var(--space-3); min-height: 0; }
.cp-pos-side .cp-cart { flex: 1; }
.cp-search { display: flex; gap: var(--space-3); align-items: center; }
.cp-search .cp-field { flex: 1; }
.cp-panel { background: var(--surface-raised); border: 0; border-radius: var(--radius-lg); padding: var(--space-4); }
.cp-h { margin: 0; font: 700 22px/28px var(--font-sans); }
.cp-h2 { margin: 0; font: 700 18px/24px var(--font-sans); }
.cp-scrim { position: absolute; inset: 0; background: rgba(12,14,13,0.45); display: grid; place-items: center; }
.cp-dialog { background: var(--surface-raised); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); padding: var(--space-5); width: 640px; max-width: calc(100% - 32px); display: grid; gap: var(--space-4); }
.cp-dialog-head { display: flex; justify-content: space-between; align-items: center; }

/* ---------- List style (thẻ trắng + dòng có chevron) ---------- */
.cp-section-label { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); font: 400 15px/20px var(--font-sans); color: var(--ink); margin: var(--space-5) 0 var(--space-3); }
.cp-section-label:first-child { margin-top: 0; }

.cp-card { background: var(--surface-raised); border-radius: var(--radius-lg); padding: 0 var(--space-5); }
.cp-card.is-padded { padding: var(--space-4) var(--space-5); }
.cp-list-row { display: flex; align-items: center; gap: var(--space-4); width: 100%; min-height: 72px; padding: var(--space-4) 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); text-align: left; font: inherit; }
.cp-list-row:last-child { border-bottom: 0; }
button.cp-list-row { cursor: pointer; }
.cp-list-row:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-sm); }
.cp-list-row > .cp-ico:first-child { color: var(--info); }
.cp-list-body { flex: 1; min-width: 0; display: grid; gap: 4px; }
.cp-list-title { font: 700 18px/24px var(--font-sans); }
.cp-list-value { font: 400 16px/22px var(--font-sans); color: var(--ink-muted); }
.cp-list-row .cp-chev { color: var(--ink-muted); }
.cp-inline-note { display: flex; gap: 6px; align-items: flex-start; font: 400 14px/20px var(--font-sans); color: var(--accent-ink); }
.cp-inline-note.is-danger { color: var(--danger); }
.cp-inline-note.is-info { color: var(--info); }
.cp-inline-note .cp-ico { margin-top: 2px; }
.cp-nav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; height: 56px; }
.cp-nav h1 { margin: 0; text-align: center; font: 500 20px/28px var(--font-sans); }
.cp-nav button { width: 48px; height: 48px; border: 0; background: none; color: var(--ink); display: grid; place-items: center; cursor: pointer; border-radius: var(--radius-pill); }
.cp-bottom-bar { position: sticky; bottom: 0; padding: var(--space-4) 0; background: linear-gradient(to top, var(--surface) 70%, transparent); }
.cp-bottom-bar .cp-btn-primary { box-shadow: var(--shadow-2); }

html, body, #root { height: 100%; }
.kx-app { position: relative; overflow: hidden; height: 100%; min-height: 680px; max-width: 834px; margin: 0 auto; background: var(--surface); display: flex; flex-direction: column; }
@media (min-width: 900px) and (min-height: 760px) {
  body { background: var(--line); }
  .kx-app { height: calc(100% - 48px); margin: 24px auto; aspect-ratio: 834 / 1194; max-height: 1194px; width: auto; border-radius: 28px; box-shadow: 0 0 0 10px #1d1f24, var(--shadow-2); }
}
.kx-app > * { flex: 1; min-height: 0; }
.pt-demo { border: 1px dashed var(--line-strong); border-radius: var(--radius-md); padding: var(--space-3); display: grid; gap: var(--space-2); }
.pt-demo-label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; }
.pt-toast { position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; display: flex; gap: var(--space-2); align-items: center; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: var(--radius-md); background: var(--brand); color: var(--on-brand); font: 500 15px/20px var(--font-sans); box-shadow: var(--shadow-2); }
.kx-h1 { margin: 0; font: 700 34px/40px var(--font-sans); text-wrap: balance; }
.kx-lead { margin: 0; font: 400 18px/27px var(--font-sans); color: var(--ink-muted); max-width: 46ch; }
.kx-lead b { color: var(--ink); }
.kx-step-tag { font: 500 13px/18px var(--font-sans); color: var(--info); text-transform: uppercase; letter-spacing: .06em; }
.kx-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.kx-actions-split > * { flex: 1; }
.kx-center { display: grid; place-items: center; padding: var(--space-5) var(--space-4); overflow: auto; }
.kx-card { background: var(--surface-raised); border-radius: 20px; padding: var(--space-5) var(--space-6) var(--space-6); width: 100%; display: grid; gap: var(--space-4); }
.kx-narrow { max-width: 560px; }
.kx-card .cp-card { background: var(--surface-sunken); }

/* scan */
.kx-scan { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--space-6); padding: var(--space-6); align-items: stretch; }
.kx-scan-cam { display: grid; min-height: 0; }
.kx-cam { position: relative; border-radius: 24px; overflow: hidden; background: #16181c; min-height: 420px; display: grid; place-items: center; }
.kx-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0; }
.kx-video.is-on { opacity: 1; }
.kx-cam-grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 16px 16px; }
.kx-oval { position: absolute; top: 9%; left: 12%; width: 76%; height: 82%; max-width: none; overflow: visible; } /* tự co theo khung camera, giữ tỉ lệ */
.kx-oval-ring { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 3; stroke-dasharray: 10 8; }
.kx-cam.is-found .kx-oval-ring { stroke-dasharray: none; stroke-width: 6; }
.kx-cam.is-fail .kx-oval-ring, .kx-cam.is-multi .kx-oval-ring { stroke: #ff8a7a; stroke-dasharray: none; }
/* hiệu ứng quét: đường xanh chạy từ đỉnh khung theo chiều kim đồng hồ → tô xanh + dấu tích trắng */
.kx-trace { fill: none; stroke: #22c55e; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 0; }
.kx-cam.is-found .kx-oval-ring { stroke: #22c55e; }
.kx-oval-fill { fill: #22c55e; stroke: #22c55e; stroke-width: 6; }
.kx-cam-flood { position: absolute; inset: 0; background: #22c55e; clip-path: circle(150% at 50% 50%); }
.kx-check { fill: none; stroke: #fff; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 0; }
@media (prefers-reduced-motion: no-preference) {
  .kx-cam.is-scanning .kx-trace { animation: kx-trace 1.4s linear forwards; }
  .kx-oval-fill { animation: kx-fill .3s ease-out both; }
  .kx-check { animation: kx-trace .35s ease-out .2s both; }
  .kx-cam-flood { animation: kx-flood .55s cubic-bezier(.4,0,.2,1) .5s both; }
  @keyframes kx-flood { from { clip-path: circle(0% at 50% 50%); } to { clip-path: circle(75% at 50% 50%); } }
  @keyframes kx-trace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes kx-fill { from { fill-opacity: 0; } to { fill-opacity: 1; } }
}
.kx-corner { position: absolute; width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.8); }
.kx-tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
.kx-tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
.kx-bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
.kx-br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
.kx-cam-tag { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font: 500 14px/20px var(--font-sans); white-space: nowrap; }

.kx-cam-face { position: absolute; width: 96px; height: 96px; border-radius: 999px; display: grid; place-items: center; background: #4fd1a8; color: #06231b; font: 700 32px/1 var(--font-sans); }
.kx-scan-side { display: flex; flex-direction: column; gap: var(--space-5); justify-content: space-between; min-width: 0; }
.kx-brand { font: 700 20px/26px var(--font-sans); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.kx-brand b { color: var(--info); }
.kx-brand span { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); margin-left: var(--space-2); }
.kx-scan-copy { display: grid; gap: var(--space-4); align-content: center; flex: 1; }
.kx-privacy { display: flex; gap: 8px; align-items: center; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.kx-privacy .cp-ico { color: var(--info); }
.kx-alt-ill { display: flex; justify-content: center; gap: var(--space-6); color: var(--info); padding: var(--space-4) 0; }

/* confirm */
.kx-confirm { max-width: 600px; }
.kx-who { display: flex; gap: var(--space-4); align-items: center; }
.kx-avatar { width: 88px; height: 88px; flex: none; border-radius: 999px; background: var(--info-soft); color: var(--info); display: grid; place-items: center; font: 700 30px/1 var(--font-sans); }

.kx-sub { font: 400 15px/22px var(--font-sans); color: var(--ink-muted); }
.kx-score { display: flex; align-items: center; gap: 8px; font: 400 15px/20px var(--font-sans); color: var(--success); }

/* thanh đếm ngược 30s để xác nhận */

/* khung camera giữ cố định kích thước giữa các trạng thái */
.kx-scan-copy { min-height: 202px; align-content: start; }

.kx-pin { display: grid; gap: var(--space-3); justify-items: center; }

.kx-pin-dots i.on { background: var(--brand); border-color: var(--brand); }
.kx-pad { display: grid; grid-template-columns: repeat(3, 84px); gap: var(--space-2); }
.kx-pad button { height: 64px; border: 0; border-radius: var(--radius-md); background: var(--surface-sunken); color: var(--ink); font: 600 24px/1 var(--font-sans); cursor: pointer; }
.kx-pad button:active { background: var(--line); }
.kx-pad button:disabled { opacity: .4; }

/* menu */
.kx-menu { display: flex; flex-direction: column; min-height: 0; }
.kx-top { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-5); flex-wrap: wrap; }
.kx-top-who { display: flex; align-items: center; gap: var(--space-3); }
.kx-top-who span:last-child { display: grid; }
.kx-top-who b { font: 700 18px/24px var(--font-sans); }
.kx-top-who small { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.kx-wallet { display: flex; gap: var(--space-2); flex: 1; justify-content: center; flex-wrap: wrap; }

.kx-w small { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.kx-w .cp-money { font-size: 18px; line-height: 24px; font-weight: 700; }
.kx-w.is-bonus { background: var(--accent-soft); }
.kx-w.is-limit { background: var(--surface-raised); }
.kx-top-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); }
.kx-idle { display: inline-flex; align-items: center; gap: 4px; font: 500 14px/20px var(--font-sans); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.kx-idle.is-warn { color: var(--danger); }
.kx-rule { margin: 0 var(--space-5); padding: 10px var(--space-4); border-radius: var(--radius-lg); background: var(--danger-soft); color: var(--danger); display: flex; gap: 8px; align-items: center; font: 400 14px/20px var(--font-sans); }
.kx-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--space-4); padding: var(--space-4) var(--space-5) var(--space-5); }
.kx-main { display: flex; flex-direction: column; gap: var(--space-3); min-height: 0; min-width: 0; }
.kx-main > .cp-tabs, .kx-main > .kx-step-tag { flex: none; }
.kx-cart .cp-btn { white-space: normal; text-align: center; }
.kx-cart { min-width: 0; }
.kx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--space-3); overflow: auto; padding: 8px 8px 8px 0; align-content: start; }
.kx-item { position: relative; display: flex; flex-direction: column; text-align: left; border: 0; padding: 0; border-radius: 16px; background: var(--surface-raised); color: var(--ink); font: inherit; cursor: pointer; overflow: visible; }
.kx-item:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.kx-item::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1; }

.kx-item.is-blocked::after { box-shadow: inset 0 0 0 2px var(--danger); }
.kx-item-ph { height: 96px; border-radius: 16px 16px 0 0; display: flex; align-items: flex-end; padding: 10px 12px; font: 600 13px/1 var(--font-sans); color: var(--ink-muted); }
.kx-item-ph span { background: var(--surface-raised); border-radius: 6px; padding: 3px 6px; }
.kx-ph-com { background: var(--accent-soft); }
.kx-ph-bun { background: var(--brand-soft); }
.kx-ph-an { background: var(--warning-soft); }
.kx-ph-nuoc { background: var(--info-soft); }
.kx-ph-trang { background: var(--success-soft); }
.kx-item-body { display: grid; gap: 4px; padding: 12px 14px 14px; }
.kx-item-name { font: 700 17px/22px var(--font-sans); }
.kx-item-desc { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.kx-item-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; min-height: 32px; }
.kx-item-foot .cp-money { font-weight: 700; font-size: 16px; }
.kx-item-foot .cp-money-strike { font-weight: 400; font-size: 13px; }
.kx-add { width: 32px; height: 32px; border-radius: 99px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; }
.kx-cart { background: var(--surface-raised); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.kx-cart-head { display: flex; align-items: baseline; gap: var(--space-2); padding: var(--space-4) var(--space-4) var(--space-2); }
.kx-cart-head .cp-muted { flex: 1; }
.kx-sheet-close { display: none; border: 0; background: none; color: var(--ink); cursor: pointer; }
.kx-cart-lines { flex: 1; overflow: auto; padding: 0 var(--space-4); }
.kx-line { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: 10px 0; border-bottom: 1px solid var(--line); }
.kx-cart-empty { flex: 1; display: grid; place-items: center; align-content: center; gap: 8px; color: var(--ink-muted); }

.kx-cart-sum { display: grid; gap: 10px; padding: var(--space-4); border-top: 1px solid var(--line); }

/* pay */
.kx-pay { max-width: 960px; }
.kx-pay-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; }

/* bố cục dọc (mặc định) */
@media all {
  .kx-scan { grid-template-columns: 1fr; padding: var(--space-4); gap: var(--space-4); }
  .kx-cam { min-height: 340px; }
  .kx-body { grid-template-columns: 1fr; padding: var(--space-3) var(--space-4) 96px; }
  .kx-cart { position: absolute; inset: auto 0 0 0; max-height: 82%; border-radius: 20px 20px 0 0; box-shadow: var(--shadow-2); z-index: 30; transform: translateY(105%); transition: transform .2s; }

  .kx-fab:disabled { background: var(--line); color: var(--ink-muted); box-shadow: none; }
  .kx-wallet { order: 3; flex-basis: 100%; justify-content: flex-start; }

}
@media (max-width: 480px) {
  .kx-h1 { font-size: 26px; line-height: 32px; }

  .kx-item-ph { height: 64px; }
  .kx-w { min-width: 0; flex: 1; }

}
.kx-grid > * { min-width: 0; }
.kx-item-foot { flex-wrap: wrap; }
.kx-scan .cp-btn, .kx-card .cp-btn { white-space: normal; text-align: center; }
.kx-scan > * { min-width: 0; }
@media all { .pt-toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }

/* màn nhận diện dọc: thương hiệu trên, camera lớn, hướng dẫn dưới */
.kx-scan { display: flex; flex-direction: column; padding: var(--space-5); gap: var(--space-4); overflow: auto; }
.kx-scan-side { display: contents; }
.kx-brand { order: -1; }

.kx-scan-copy { flex: none; text-align: center; justify-items: center; gap: var(--space-3); }
.kx-scan-copy .kx-lead { max-width: 40ch; }
.kx-privacy { justify-content: center; }
.kx-h1 { font-size: 32px; line-height: 38px; }
/* thanh giỏ hàng dưới */

.kx-body { padding-bottom: 104px; }
.kx-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.kx-scrim { position: absolute; inset: 0; background: rgba(12,14,13,.4); z-index: 25; }
/* đăng nhập bằng điện thoại */
.kx-phone { justify-items: center; }
.kx-phone .cp-nav, .kx-phone .pt-demo, .kx-phone .kx-ttl { justify-self: stretch; }
.kx-pqr { position: relative; width: min(100%, 340px); aspect-ratio: 1; padding: 18px; background: var(--qr-ground); border-radius: 20px; border: 1px solid var(--line); }
.kx-pqr svg { display: block; width: 100%; height: 100%; }

          h('span', null, h('b', null, 'Chào ' + p.name.split(' ').pop()), h('small', null, [p.roleLabel, p.klass].join(' · ')))),
        h('div', { className: 'kx-wallet' },
          h('div', { className: 'kx-w' }, h('small', null, 'Tiền thật'), h(C.Money, { value: p.real })),
          h('div', { className: 'kx-w is-bonus' }, h('small', null, 'Tiền thưởng'), h(C.Money, { value: p.bonus, tone: 'accent' })),
          limLeft != null ? h('div', { className: 'kx-w is-limit' }, h('small', null, 'Hạn mức còn'), h(C.Money, { value: limLeft })) : null),
        h('div', { className: 'kx-top-right' },
          h('span', { className: 'kx-idle' + (props.idle <= 15 ? ' is-warn' : ''), title: 'Tự đăng xuất khi không thao tác' }, h(C.Icon, { name: 'clock', size: 16 }), props.idle + 's'),
          h(C.Button, { variant: 'secondary', icon: 'x', onClick: props.logout }, 'Thoát'))),
      p.blocked ? h('div', { className: 'kx-rule' }, h(C.Icon, { name: 'lock', size: 16 }), 'Theo cài đặt của phụ huynh/nhà trường, ' + p.blocked.join(' và ').toLowerCase() + ' không bán cho tài khoản này.') : null,
      h('div', { className: 'kx-body' },
        h('div', { className: 'kx-main' },
          h('div', { className: 'kx-step-tag' }, 'Bước 3/3 · Chọn món'),
          h(C.CategoryTabs, { items: CATS.map(function (c) { return { id: c.id, label: c.label }; }), active: cat[0], onChange: cat[1] }),
          h('div', { className: 'kx-grid' }, items.map(card))),
        cartPanel),
      h('button', { type: 'button', className: 'kx-fab', disabled: !cart.length, onClick: function () { sheet[1](true); } },
        h('span', { className: 'kx-fab-l' }, h('span', { className: 'kx-fab-n' }, count), h('span', null, count ? 'Xem đơn & thanh toán' : 'Chưa chọn món')),
        h('b', { className: 'cp-num' }, fmt(total))),
      sheet[0] ? h('div', { className: 'kx-scrim', onClick: function () { sheet[1](false); } }) : null);
  }

  /* ---------------- 4. Thanh toán ---------------- */
  function Pay(props) {
    var p = props.person, cart = props.cart, mode = useState('now');
    var total = cart.reduce(function (s, l) { return s + priceOf(itemOf(l.code)) * l.qty; }, 0);
    var limLeft = p.limit ? p.limit.max - p.limit.used : Infinity;
    var cap = Math.min(total, limLeft);
    var bonus = Math.min(p.bonus, cap), real = Math.min(p.real, cap - bonus), short = total - bonus - real;
    var add = p.uni ? etaAdd(QUEUE) : 10;
    var pickup = mode[0] === 'now' ? addMin(add) : '11:30';
    return h('div', { className: 'kx-center' }, h('div', { className: 'kx-card kx-pay' },
      h(C.NavBar, { title: 'Xác nhận thanh toán', onBack: props.onBack }),
      h('div', { className: 'kx-pay-grid' },
        h('div', { className: 'cp-stack' },
          h(C.SectionLabel, null, 'Đơn của ' + p.name),
          h('div', { className: 'cp-card' }, cart.map(function (l) {
            var m = itemOf(l.code);
            return h(C.ListRow, { key: l.code, title: l.qty + ' × ' + m.name, value: fmt(priceOf(m)) + ' / phần', trailing: h(C.Money, { value: priceOf(m) * l.qty }) });
          })),
          h(C.SectionLabel, null, 'Nhận món'),
          h('div', { className: 'kx-seg' },
            h('button', { type: 'button', 'aria-pressed': String(mode[0] === 'now'), onClick: function () { mode[1]('now'); } }, h('b', null, 'Lấy ngay'), h('small', null, 'Quầy ' + KIOSK.counter + ' · khoảng ' + pickup)),
            h('button', { type: 'button', 'aria-pressed': String(mode[0] === 'later'), onClick: function () { mode[1]('later'); } }, h('b', null, 'Giờ nghỉ trưa'), h('small', null, 'Quầy ' + KIOSK.counter + ' · 11:30'))),
          p.uni && mode[0] === 'now' ? h(C.InlineNote, { tone: 'info' }, 'Canteen đang có ' + QUEUE + ' đơn chờ → sinh viên cộng thêm ' + add + ' phút.') : null),
        h('div', { className: 'cp-stack' },
          h(C.SectionLabel, null, 'Trừ ví'),
          h('div', { className: 'cp-card is-padded cp-stack', style: { gap: 10 } },
            h('div', { className: 'cp-sum-row' }, h('span', null, 'Tổng đơn'), h(C.Money, { value: total })),
            h('div', { className: 'cp-sum-row is-discount' }, h('span', null, 'Tiền thưởng (dùng trước)'), h(C.Money, { value: -bonus })),
            h('div', { className: 'cp-sum-row' }, h('span', null, 'Tiền thật'), h(C.Money, { value: -real })),
            short > 0 ? h('div', { className: 'cp-change is-short' }, h('label', null, h(C.Icon, { name: 'alert' }), 'Trả tại quầy thu ngân'), h(C.Money, { value: short, size: 'lg' })) : null,
            h('div', { className: 'cp-sum-row is-total' }, h('span', null, 'Số dư sau đơn'), h(C.Money, { value: p.real + p.bonus - bonus - real }))),
          short > 0 ? h(C.InlineNote, null, 'Đơn sẽ chờ ở quầy thu ngân cho tới khi bạn trả ' + fmt(short) + ' bằng tiền mặt hoặc QR.') : null,
          h(C.Button, { size: 'lg', block: true, icon: 'check', onClick: function () { var o = { bonus: bonus, real: real, short: short, pickup: pickup, total: total }; if (!cfg.pay) return props.onPaid(o); cfg.pay(Object.assign({ person: p, cart: props.cart }, o)).then(function (res) { props.onPaid(Object.assign(o, res || {})); }, function () { props.say && props.say('Chưa trừ được ví — thử lại hoặc gặp thu ngân', 'alert'); }); } }, short > 0 ? 'Trừ ví ' + fmt(bonus + real) + ' & gửi đơn' : 'Trừ ví ' + fmt(total))))));
  }

  /* ---------------- 5. Hoàn tất ---------------- */
  function Done(props) {
    var r = props.result, p = props.person, sec = useState(12);
    useEffect(function () { var t = setInterval(function () { sec[1](function (s) { if (s <= 1) { clearInterval(t); props.onExit(); return 0; } return s - 1; }); }, 1000); return function () { clearInterval(t); }; }, []);
    return h('div', { className: 'kx-center' }, h('div', { className: 'kx-card kx-done' },
      h('div', { className: 'kx-done-icon' + (r.short ? ' is-warn' : '') }, h(C.Icon, { name: r.short ? 'clock' : 'check', size: 40, stroke: 2.4 })),
      h('div', { className: 'kx-q' }, r.short ? 'Đơn đã gửi — còn ' + fmt(r.short) + ' trả tại quầy' : 'Đặt món thành công'),
      h('div', { className: 'kx-ticket cp-num' }, r.code),
      h('p', { className: 'kx-lead' }, 'Đọc mã này ở ', h('b', null, 'Quầy ' + KIOSK.counter), ', khoảng ', h('b', null, r.pickup), '. Màn hình quầy sẽ báo khi món sẵn sàng.'),
      h('div', { className: 'cp-card is-padded kx-done-sum' },
        h('div', { className: 'cp-sum-row' }, h('span', null, 'Đã trừ tiền thưởng'), h(C.Money, { value: r.bonus, tone: 'accent' })),
        h('div', { className: 'cp-sum-row' }, h('span', null, 'Đã trừ tiền thật'), h(C.Money, { value: r.real })),
        h('div', { className: 'cp-sum-row is-total' }, h('span', null, 'Số dư còn lại'), h(C.Money, { value: p.real + p.bonus }))),
      h(C.Button, { size: 'lg', block: true, onClick: props.onExit }, 'Xong · đăng xuất (' + sec[0] + 's)')));
  }

  /* ---------------- App ---------------- */
  function App() {
    var step = useState('scan'), person = useState(null), method = useState('face'), cart = useState([]), result = useState(null), idle = useState(IDLE_SECONDS), seq = useState(153), toast = useState(null);
    var tt = useRef();
    function say(t, i) { toast[1]({ text: t, icon: i }); clearTimeout(tt.current); tt.current = setTimeout(function () { toast[1](null); }, 3000); }
    function reset(msg, evt) { if (step[0] !== 'scan') emit(evt || 'logout', person[0]); step[1]('scan'); person[1](null); cart[1]([]); result[1](null); idle[1](IDLE_SECONDS); if (msg) say(msg, 'user'); }

    // tự đăng xuất khi không thao tác ở menu / thanh toán
    useEffect(function () {
      if (step[0] !== 'menu' && step[0] !== 'pay' && step[0] !== 'confirm') return;
      var t = setInterval(function () { idle[1](function (s) { if (s <= 1) { clearInterval(t); reset('Đã tự đăng xuất do không thao tác'); return IDLE_SECONDS; } return s - 1; }); }, 1000);
      function poke() { idle[1](IDLE_SECONDS); }
      window.addEventListener('pointerdown', poke); window.addEventListener('keydown', poke);
      return function () { clearInterval(t); window.removeEventListener('pointerdown', poke); window.removeEventListener('keydown', poke); };
    }, [step[0]]);

    function found(p, m) { person[1](Object.assign({}, p)); method[1](m || 'face'); step[1]('confirm'); idle[1](IDLE_SECONDS); }
    // đầu đọc thẻ / QR đọc được ở màn nhận diện hoặc màn thẻ
    useBridge('card', function (r) { if ((step[0] === 'scan' || step[0] === 'alt') && r.person) found(r.person, r.method); });
    function add(code) { var c = cart[0].slice(), i = c.findIndex(function (l) { return l.code === code; }); var m = itemOf(code); if (m.stock != null && i >= 0 && c[i].qty >= m.stock) return; if (i >= 0) c[i] = { code: code, qty: c[i].qty + 1 }; else c.push({ code: code, qty: 1 }); cart[1](c); }
    function qty(i, d) { cart[1](cart[0].map(function (l, j) { return j === i ? { code: l.code, qty: l.qty + d } : l; }).filter(function (l) { return l.qty > 0; })); }
    function paid(r) {
      var p = Object.assign({}, person[0]); p.bonus -= r.bonus; p.real -= r.real; if (p.limit) p.limit = { used: p.limit.used + r.bonus + r.real, max: p.limit.max };
      var key = Object.keys(PEOPLE).filter(function (k) { return PEOPLE[k].id === p.id; })[0]; if (key) PEOPLE[key] = Object.assign({}, PEOPLE[key], { real: p.real, bonus: p.bonus, limit: p.limit });
      emit('paid', Object.assign({ person: p, cart: cart[0] }, r));
      person[1](p); result[1](Object.assign({ code: 'K-' + String(seq[0]).padStart(4, '0') }, r)); seq[1](seq[0] + 1); cart[1]([]); step[1]('done');
    }

    var screen;
    if (step[0] === 'scan') screen = h(Scan, { onFound: found, onAlt: function () { step[1]('alt'); }, onPhone: function () { step[1]('phone'); } });
    else if (step[0] === 'phone') screen = h(PhoneLogin, { say: say, onBack: function () { step[1]('scan'); }, onLogin: function (p) { emit('confirmed', { person: p, method: 'phone' }); person[1](Object.assign({}, p)); method[1]('phone'); step[1]('menu'); idle[1](IDLE_SECONDS); say('Đã đăng nhập qua điện thoại · ' + p.name, 'check'); } });
    else if (step[0] === 'alt') screen = h(Alt, { onBack: function () { step[1]('scan'); }, onFound: found });
    else if (step[0] === 'confirm') screen = h(Confirm, { person: person[0], method: method[0], onOk: function () { emit('confirmed', { person: person[0], method: method[0] }); step[1]('menu'); say('Đã đăng nhập tài khoản ' + person[0].name, 'check'); }, onNo: function () { reset('Đã hủy — mời người tiếp theo', 'cancel'); }, onTimeout: function () { reset('Hết 30 giây chưa xác nhận — đã hủy', 'cancel'); } });
    else if (step[0] === 'menu') screen = h(Menu, { person: person[0], cart: cart[0], add: add, qty: qty, idle: idle[0], logout: function () { reset('Đã đăng xuất'); }, checkout: function () { step[1]('pay'); } });
    else if (step[0] === 'pay') screen = h(Pay, { person: person[0], cart: cart[0], onBack: function () { step[1]('menu'); }, onPaid: paid });

    return h('div', { className: 'kx-app' }, screen,
      toast[0] ? h('div', { className: 'pt-toast', role: 'status' }, h(C.Icon, { name: toast[0].icon || 'check' }), toast[0].text) : null);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
